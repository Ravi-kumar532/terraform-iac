# Azure DevOps Azure Terraform pipeline.
# Configure a Workload Identity Federation Azure service connection and protected
# environments named terraform-dev, terraform-qa, terraform-staging, terraform-prod.
trigger: none
pr: none

parameters:
  - name: environment
    displayName: Deployment environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - staging
      - prod
  - name: action
    displayName: Terraform operation
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy
  - name: confirmDestroy
    displayName: Type DESTROY to permit destroy
    type: string
    default: ""

variables:
  - group: terraform-shared
  - group: terraform-${{ parameters.environment }}

stages:
  - stage: Validate
    displayName: Format and validate Terraform
    jobs:
      - job: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform 1.10.5
            inputs:
              terraformVersion: 1.10.5
          - bash: terraform fmt -check -recursive
            displayName: Check Terraform formatting
          - bash: bash scripts/terraform-validate.sh
            displayName: Initialize and validate every provider module and root

  - stage: Deploy
    displayName: Azure ${{ parameters.action }} / ${{ parameters.environment }}
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: AzureTerraform
        displayName: Azure OIDC Terraform deployment
        environment: terraform-${{ parameters.environment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  displayName: Install Terraform 1.10.5
                  inputs:
                    terraformVersion: 1.10.5
                - task: AzureCLI@2
                  displayName: Initialize, plan and execute approved operation
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      export ARM_USE_OIDC=true
                      export ARM_USE_AZUREAD=true
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_SUBSCRIPTION_ID="$(AZURE_SUBSCRIPTION_ID)"
                      export TF_IN_AUTOMATION=true
                      export TF_INPUT=false
                      export TF_VAR_environment="${{ parameters.environment }}"
                      export TF_VAR_tenant_id="$tenantId"
                      export TF_VAR_subscription_id="$(AZURE_SUBSCRIPTION_ID)"
                      export TF_VAR_client_id="$servicePrincipalId"

                      if [[ -z "$(TERRAFORM_INPUTS_JSON)" ]]; then
                        echo "TERRAFORM_INPUTS_JSON must contain the non-secret module input arrays."
                        exit 1
                      fi

                      input_file="$AGENT_TEMPDIRECTORY/terraform.tfvars.json"
                      printf '%s' "$(TERRAFORM_INPUTS_JSON)" > "$input_file"
                      chmod 600 "$input_file"
                      jq -e 'type == "object"' "$input_file" >/dev/null

                      if [[ -n "$(AZURE_SQL_CREDENTIALS_SECRET)" ]]; then
                        sql_credentials="$(az keyvault secret show \
                          --vault-name "$(AZURE_SECRETS_VAULT)" \
                          --name "$(AZURE_SQL_CREDENTIALS_SECRET)" \
                          --query value --output tsv)"
                        echo "::add-mask::$sql_credentials"
                        export TF_VAR_azure_sql_server_credentials="$sql_credentials"
                      fi

                      terraform -chdir=providers/azure init -input=false \
                        -backend-config="resource_group_name=$(TFSTATE_RESOURCE_GROUP)" \
                        -backend-config="storage_account_name=$(TFSTATE_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=$(TFSTATE_CONTAINER)" \
                        -backend-config="key=${{ parameters.environment }}/terraform.tfstate" \
                        -backend-config="use_oidc=true" \
                        -backend-config="use_azuread_auth=true" \
                        -backend-config="tenant_id=$tenantId" \
                        -backend-config="client_id=$servicePrincipalId" \
                        -backend-config="subscription_id=$(AZURE_SUBSCRIPTION_ID)"

                      terraform -chdir=providers/azure validate -no-color
                      terraform -chdir=providers/azure plan -input=false -no-color \
                        -var-file="$input_file" -out="$AGENT_TEMPDIRECTORY/terraform.tfplan"

                      if [[ "${{ parameters.action }}" == "apply" ]]; then
                        terraform -chdir=providers/azure apply -input=false -no-color "$AGENT_TEMPDIRECTORY/terraform.tfplan"
                      elif [[ "${{ parameters.action }}" == "destroy" ]]; then
                        if [[ "${{ parameters.confirmDestroy }}" != "DESTROY" ]]; then
                          echo "Destroy requires confirmDestroy=DESTROY and approval of the Azure DevOps environment."
                          exit 1
                        fi
                        terraform -chdir=providers/azure destroy -input=false -auto-approve -no-color -var-file="$input_file"
                      fi
                  env:
                    TERRAFORM_INPUTS_JSON: $(TERRAFORM_INPUTS_JSON)
                    TFSTATE_RESOURCE_GROUP: $(TFSTATE_RESOURCE_GROUP)
                    TFSTATE_STORAGE_ACCOUNT: $(TFSTATE_STORAGE_ACCOUNT)
                    TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    AZURE_SECRETS_VAULT: $(AZURE_SECRETS_VAULT)
                    AZURE_SQL_CREDENTIALS_SECRET: $(AZURE_SQL_CREDENTIALS_SECRET)
